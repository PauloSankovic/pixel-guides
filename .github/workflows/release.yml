name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check that the tag matches manifest.json
        run: |
          VERSION=$(node -p "require('./manifest.json').version")
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match manifest version $VERSION"
            exit 1
          fi

      - name: Lint
        run: npx web-ext lint

      - name: Sign with Mozilla (unlisted channel)
        run: npx web-ext sign --channel unlisted
        env:
          WEB_EXT_API_KEY: ${{ secrets.AMO_JWT_ISSUER }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_JWT_SECRET }}

      - name: Create GitHub release
        run: |
          mv web-ext-artifacts/*.xpi "pixel-guides-${GITHUB_REF_NAME#v}.xpi"
          gh release create "$GITHUB_REF_NAME" pixel-guides-*.xpi \
            --title "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
